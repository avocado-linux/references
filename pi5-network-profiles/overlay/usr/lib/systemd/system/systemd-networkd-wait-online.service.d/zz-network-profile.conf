[Service]
# Reach network-online as soon as ONE managed link is up, and give up after 30 s. A unit with
# one cable, or with a Wi-Fi radio that has no network configured, must not hold boot for the
# links that are absent or idle, and without --any a present but idle wlan0 counts as a link
# to wait for (measured: the wait ran to its timeout with eth0 routable).
#
# This file is named so that it sorts after the image's own wait-online-any.conf. Drop-ins
# apply in file name order, so the empty ExecStart= below resets whatever that file set, and
# the command below states the path and options this extension relies on.
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any --timeout=30
