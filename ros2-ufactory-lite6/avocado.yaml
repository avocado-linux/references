cli_requirement: ">=0.41.0"

default_target: "imx95-frdm"

supported_targets:
  - imx8mp-evk
  - imx91-frdm
  - imx93-evk
  - imx93-frdm
  - imx95-frdm
  - raspberrypi5
  - rzv2n-sr-som
  - stm32mp257f-dk
  - rubikpi3
  - grinn-astra-1680-sbc

##
## Distribution
##

distro:
  release: 2024
  channel: next

##
## Runtimes
##

runtimes:
  dev:
    extensions:
      - app
      - docker
      - network
      - avocado-ext-dev
      - avocado-ext-sshd-dev
      - avocado-bsp-{{ avocado.target.board }}
    packages:
      avocado-runtime: "*"

##
## Extensions
##

extensions:
  # Docker engine extension — identical shape to the docker-save reference.
  docker:
    version: 0.1.0
    enable_services:
      - docker.service
    on_merge:
      - systemctl restart --no-block docker.service
    on_unmerge:
      - systemctl stop docker.service
    overlay: overlay/docker
    packages:
      ca-certificates: '*'
      docker: '*'
      iptables-modules: '*'
      kernel-module-br-netfilter: '*'
      kernel-module-ip-tables: '*'
      kernel-module-ip6table-filter: '*'
      kernel-module-ip6table-mangle: '*'
      kernel-module-ip6table-nat: '*'
      kernel-module-iptable-filter: '*'
      kernel-module-iptable-mangle: '*'
      kernel-module-iptable-nat: '*'
      kernel-module-nf-conntrack-netlink: '*'
      kernel-module-nf-nat: '*'
      kernel-module-veth: '*'
      kernel-module-xt-addrtype: '*'
      kernel-module-xt-conntrack: '*'
      kernel-module-xt-masquerade: '*'

  # Network confext — single Ethernet, DHCP from the user's LAN.
  # The arm + the developer laptop + this device all sit on one shared LAN.
  network:
    types:
      - confext
    version: "0.1.0"
    overlay: overlay/network

  # Application extension — ships the saved Docker image tarball and the
  # systemd unit that loads it on first merge and runs the container.
  app:
    types:
      - sysext
      - confext
    version: "0.1.0"
    summary: "ROS 2 Humble + xArm SDK controller for UFactory Lite 6, shipped as a docker-save tarball"
    packages:
      curl: "*"
    enable_services:
      - container-app.service
    on_merge:
      - systemctl restart --no-block container-app.service
    on_unmerge:
      - systemctl stop container-app.service
    overlay: overlay/app
    var_files:
      - var/lib/docker/**

  avocado-ext-dev:
    source:
      type: package
      version: "*"

  avocado-ext-sshd-dev:
    source:
      type: package
      version: "*"

  avocado-bsp-{{ avocado.target.board }}:
    source:
      type: package
      version: "*"

##
## Images
##

rootfs:
  permissions: dev

initramfs:
  permissions: dev

##
## Permissions
##

# Default config profile — empty root password for development. NOT FOR PRODUCTION.
# The `dev` profile is referenced by rootfs/initramfs above. Define additional
# profiles with real users, groups, and hashed passwords, then point
# rootfs/initramfs at them via `permissions: <name>`.
permissions:
  dev:
    users:
      root:
        password: ""

##
## SDK
##

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"

  container_args:
    - --privileged
    - -v /dev:/dev
    - -v /sys:/sys

  packages:
    avocado-sdk-toolchain: "*"
    # nativesdk-docker is intentionally omitted — same reasoning as docker-save:
    # the image is built locally on the dev machine and seeded via overlay, not
    # pulled from a registry at build time.
