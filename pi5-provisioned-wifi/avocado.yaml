cli_requirement: ">=0.41.0"

default_target: "raspberrypi5"

supported_targets:
  - raspberrypi5

##
## Distribution
##

# Wi-Fi support for the Pi 5's onboard radio is in the 2026 release.
distro:
  release: 2026
  channel: next

##
## Runtimes
##

runtimes:
  dev:
    extensions:
      - avocado-ext-dev
      - avocado-ext-sshd-dev
      - avocado-bsp-{{ avocado.target.board }}
      - wifi-station
    packages:
      avocado-runtime: "*"

##
## Extensions
##

extensions:
  avocado-ext-dev:
    source:
      type: package
      version: "*"

  avocado-ext-sshd-dev:
    source:
      type: package
      version: "*"

  avocado-bsp-{{ avocado.target.board }}:
    source:
      type: package
      version: "*"

  # The onboard radio, wpa_supplicant, and a unit that reads its credentials
  # from /var. The credentials are never part of the extension: the unit stays
  # inactive until provisioning writes the config (see getting_started.md).
  wifi-station:
    types:
      - sysext
      - confext
    version: "0.1.0"
    summary: "Wi-Fi station whose credentials are provisioned into /var"
    overlay: overlay
    enable_services:
      - wifi-station.service
    packages:
      kernel-module-brcmfmac: "*"
      kernel-module-brcmfmac-wcc: "*"
      kernel-module-brcmutil: "*"
      kernel-module-cfg80211: "*"
      kernel-module-rfkill: "*"
      linux-firmware-rpidistro-bcm43455: "*"
      linux-firmware-rpidistro-bcm43456: "*"
      wpa-supplicant: "*"
      iw: "*"
      wireless-regdb-static: "*"

##
## Images
##

rootfs:
  permissions: dev

initramfs:
  permissions: dev

##
## Permissions
##

# NOT FOR PRODUCTION: the `dev` profile sets an empty root password and is
# referenced by rootfs/initramfs above. Define additional profiles with real
# users, groups, and hashed passwords, then point rootfs/initramfs at them via
# `permissions: <name>`.
permissions:
  dev:
    users:
      root:
        password: ""

##
## SDK
##

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"

  container_args:
    - --privileged
    - --network=host
    - -v /dev:/dev
    - -v /sys:/sys

  packages:
    avocado-sdk-toolchain: "*"
