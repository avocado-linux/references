cli_requirement: ">=0.41.0"

default_target: "jetson-orin-nano-devkit"

supported_targets:
  - jetson-orin-nano-devkit
  - jetson-agx-orin-devkit
  - jetson-agx-thor

##
## Distribution
##

distro:
  release: 2026
  channel: next

##
## Runtimes
##
## The DeepStream vision pipeline is split across five cohesive extensions
## (see the README "Extension layout" section for the why). systemd-sysext
## has no inter-extension dependency mechanism, so the runtime's extension
## list IS the contract: a working pipeline needs all five composed together.
##
##   vision-runtime  — the DeepStream/CUDA/TensorRT/GStreamer/Python deps
##   vision-models   — the ONNX model weights
##   vision-engines  — the prebuilt TensorRT engines for THIS build's target
##   vision-config   — the nvinfer/tracker/analytics tuning configs
##   vision-app      — the application code (app.py + service + preflight)
##

runtimes:
  dev:
    extensions:
      - avocado-ext-dev
      - avocado-ext-sshd-dev
      - avocado-bsp-{{ avocado.target }}
      - vision-runtime
      - vision-models
      - vision-engines
      - vision-config
      - vision-app
    packages:
      avocado-runtime: "*"
      kernel-modules: "*"

##
## Extensions
##

extensions:
  avocado-ext-dev:
    source:
      type: package
      version: "*"

  avocado-ext-sshd-dev:
    source:
      type: package
      version: "*"

  avocado-bsp-{{ avocado.target }}:
    source:
      type: package
      version: "*"

  # ---------------------------------------------------------------------------
  # vision-runtime — the platform layer (your DEPENDENCIES).
  #
  # The heavy, stable third-party stack the pipeline runs on: DeepStream, the
  # Python bindings, TensorRT, CUDA/cuDNN, the NVIDIA GStreamer plugins, the
  # UVC camera kernel module, and the Python interpreter + bindings the app
  # imports. This is by far the largest extension (GB-scale once the packages
  # are composed in) and it only changes on a JetPack / DeepStream / CUDA bump.
  # Isolating it here means a business-logic change to vision-app never
  # re-ships any of these bytes over the air.
  #
  # MUST be sysext AND confext: the CUDA / TensorRT / DeepStream packages ship
  # their libraries under /usr and /opt (sysext) but ALSO drop
  # /etc/ld.so.conf.d/*.conf entries (confext) that point ldconfig at the
  # DeepStream + CUDA library directories (e.g. /opt/nvidia/deepstream/.../lib).
  # Without the confext those /etc entries are dropped, ldconfig never learns
  # those paths, and the NVIDIA GStreamer plugins fail to dlopen their deps —
  # GStreamer then reports `no element "nvvideoconvert"` / `"nvinfer"` etc. and
  # the pipeline can't be built.
  # ---------------------------------------------------------------------------
  vision-runtime:
    types:
      - sysext
      - confext
    version: "0.1.0"
    summary: "DeepStream 9.1 + CUDA/TensorRT/GStreamer/Python runtime for the vision pipeline"

    packages:
      # The DeepStream runtime + Python bindings (pyds)
      deepstream-9.1: "*"
      deepstream-9.1-pyds: "*"

      # Inference backend (DeepStream's nvinfer wraps this)
      tensorrt-core: "*"

      # CUDA + cuDNN runtime libs
      cuda-cudart: "*"
      cuda-libraries: "*"
      cudnn: "*"

      # GStreamer + NVIDIA-accelerated plugins used by the pipeline
      gstreamer1.0: "*"
      gstreamer1.0-plugins-base: "*"
      gstreamer1.0-plugins-base-app: "*"
      gstreamer1.0-plugins-base-videoconvertscale: "*"
      gstreamer1.0-plugins-good: "*"
      gstreamer1.0-plugins-good-video4linux2: "*"
      gstreamer1.0-plugins-good-jpeg: "*"
      gstreamer1.0-plugins-good-multipart: "*"
      gstreamer1.0-plugins-nvjpeg: "*"
      gstreamer1.0-plugins-nvvidconv: "*"
      gstreamer1.0-plugins-nvv4l2camerasrc: "*"

      # Kernel module for USB UVC cameras
      kernel-module-uvcvideo: "*"

      # Python runtime + GStreamer bindings + Flask. These live in the runtime
      # (dependencies) layer, NOT in vision-app: bundling the Python
      # interpreter with the app would bloat the app extension and defeat the
      # point of a kilobyte-sized business-logic OTA.
      python3: "*"
      python3-pygobject: "*"
      python3-flask: "*"

      # Diagnostics / convenience on-device
      v4l-utils: "*"
      curl: "*"

  # ---------------------------------------------------------------------------
  # vision-models — the model weights (target-agnostic).
  #
  # The four ONNX files. An ONNX is portable across GPUs, so these carry no
  # target suffix. Lives at /usr/lib/nvidia-deepstream/models/<model>/ — the
  # same path the nvinfer configs reference. Re-ships only when a model is
  # retrained or swapped (~31 MB), independently of the runtime and the app.
  # ---------------------------------------------------------------------------
  vision-models:
    types:
      - sysext
    version: "0.1.0"
    summary: "ONNX model weights: PeopleNet, MoveNet, YOLOX-Hand, Hand Landmark"
    overlay: vision-models/overlay

    packages:
      # `vision-models/overlay` ships the committed ONNX files; the compile
      # step (re)downloads any that are missing and rewrites MoveNet NHWC→NCHW.
      models:
        compile: vision-models
        install: models-install.sh

    on_merge:
      # Pick up a freshly-OTA'd model without a reboot (no-op if app not running).
      - systemctl try-restart vision-app.service

    sdk:
      packages:
        # Used by the MoveNet NHWC→NCHW ONNX rewrite in models-compile.sh.
        nativesdk-uv: "*"

  # ---------------------------------------------------------------------------
  # vision-engines — prebuilt TensorRT engines for THIS build's target.
  #
  # A TensorRT engine is the compiled form of a model, pinned to the GPU's
  # compute capability, SM count, memory hierarchy, and TRT/CUDA version — so
  # engines are inherently target-specific. There is no target suffix on the
  # extension name because every Avocado build targets a single board: the
  # compile hook stages only `prebuilt-engines/$AVOCADO_TARGET/`, so this
  # extension always contains exactly the right engines for the image being
  # built. Engines are loaded directly from this read-only extension (no /var
  # staging) — which is why every supported target MUST ship a prebuilt engine.
  # ---------------------------------------------------------------------------
  vision-engines:
    types:
      - sysext
    version: "0.1.0"
    summary: "Prebuilt TensorRT FP16 engines for the build target"
    overlay: vision-engines/overlay

    packages:
      engines:
        compile: vision-engines
        install: engines-install.sh

    on_merge:
      - systemctl try-restart vision-app.service

  # ---------------------------------------------------------------------------
  # vision-config — the tunables (confext).
  #
  # nvinfer / tracker / analytics configs in /etc/nvidia-deepstream/. These are
  # the knobs an integrator turns most often after the logic is stable (ROI
  # polygons, confidence thresholds, tracker profile). Splitting them out makes
  # a retune a kilobyte-sized confext OTA.
  # ---------------------------------------------------------------------------
  vision-config:
    types:
      - confext
    version: "0.1.0"
    summary: "nvinfer / tracker / nvdsanalytics tuning configs"
    overlay: vision-config/overlay

    on_merge:
      - systemctl try-restart vision-app.service

  # ---------------------------------------------------------------------------
  # vision-app — the application (your CODE).
  #
  # Just app.py, its systemd unit, and the start-time preflight script. No
  # packages: every dependency comes from vision-runtime. This is the extension
  # an application engineer edits day to day, and after the split it is the only
  # thing that re-ships on a logic change — a kilobyte-scale OTA.
  # ---------------------------------------------------------------------------
  vision-app:
    types:
      - sysext
    version: "0.1.0"
    summary: "DeepStream person detection + tracking + pose + hands application"
    overlay: vision-app/overlay

    enable_services:
      - vision-app.service

    on_merge:
      - systemctl restart --no-block vision-app.service

    on_unmerge:
      - systemctl stop vision-app.service

##
## Images
##

rootfs:
  permissions: dev

initramfs:
  permissions: dev

##
## Permissions
##

# NOT FOR PRODUCTION: the `dev` profile sets an empty root password and is
# referenced by rootfs/initramfs above. Define additional profiles with real
# users, groups, and hashed passwords, then point rootfs/initramfs at them via
# `permissions: <name>`.
permissions:
  dev:
    users:
      root:
        password: ""

##
## SDK
##

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"

  container_args:
    - --privileged
    - --network=host
    - -v /dev:/dev
    - -v /sys:/sys

  compile:
    vision-models:
      compile: models-compile.sh
      clean: models-clean.sh
    vision-engines:
      compile: engines-compile.sh
      clean: engines-clean.sh

  packages:
    avocado-sdk-toolchain: "*"
