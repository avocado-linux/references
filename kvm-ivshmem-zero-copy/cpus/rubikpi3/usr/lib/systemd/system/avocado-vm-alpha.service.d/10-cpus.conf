[Service]
# One dedicated big core. The guest spins on a shared-memory word rather than
# sleeping -- that busy-poll IS the low-latency path -- so an unpinned VM
# chases the scheduler and smears the numbers. Measured: pinned to a little
# core (the original CPUAffinity=1/2) gave p50 72 us and 106 MiB/s; on a big
# core, p50 5.0 us and ~1.4 GiB/s.
#
# One core, not two. Widening this to give the qemu IO threads a core of their
# own (CPUAffinity=4 6) was measured and is worse: p50 unchanged at 5416 ns but
# p99 loosens from 5833-5937 ns to 5885-7552 ns, because both VMs' now-RT IO
# threads contend on the shared core.
CPUAffinity=4
