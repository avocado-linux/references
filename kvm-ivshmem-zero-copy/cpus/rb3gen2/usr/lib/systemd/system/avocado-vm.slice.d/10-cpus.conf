[Slice]
# QCS6490 is 4x A55 (cpu0-3, capacity 382) + 3x A78 (cpu4-6, 889) + 1x A78
# prime (cpu7, 1024). The VMs get 4-6; the little cores keep the OS.
#
# cpu7 is deliberately excluded even though it is the fastest core. Measured
# with /proc/softirqs across a 20000-iteration run, cpu7 takes the interrupt
# work the others do not -- HI 385, NET_RX 99, TASKLET 100, TIMER 746, against
# roughly 100 TIMER and nothing else on cpu4-6. Those are the managed IRQs that
# refuse to be reaffined. A VM on cpu7 saw a 91-338 us tail and up to 5 samples
# past 10x median; moving off it gave 23-34 us and zero.
AllowedCPUs=4-6
