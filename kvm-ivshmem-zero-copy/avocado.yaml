cli_requirement: ">=0.41.0"

# Two KVM guests on a PREEMPT_RT Qualcomm board (QCS6490) passing data through
# one shared-memory region with no copies. The shape:
#
#   vmm       class: platform     qemu + launcher + guest images (carried once)
#    ^   ^  depends_on
#   vm-alpha  vm-beta             class: application, an identity each
default_target: "rb3gen2"
supported_targets:
  - rb3gen2
  - rubikpi3

distro:
  release: 2026
  channel: next

# The host runs PREEMPT_RT; the 2026 feed carries stock and RT kernels off one
# source tree. `*` is a PREFIX glob only, so "6.18.37-rt*" selects RT ("*rt*"
# would not). Drop this block for the stock kernel.
kernel:
  version: "6.18.37-rt*"

# One runtime, shared by every target -- the test is identical across boards
# (both QCS6490). Per-board support is the templated BSP entry, which also
# selects a mezzanine variant, e.g.
#   AVOCADO_TARGET_BOARD=rb3gen2-vision avocado install -t rb3gen2
# pulls avocado-bsp-rb3gen2-vision (which depends_on the core kit).
runtimes:
  rt-vms:
    extensions:
      - avocado-ext-dev
      - avocado-ext-sshd-dev
      - avocado-bsp-{{ avocado.target.board }}
      - vmm
      - vmm-cpus
      - vm-alpha
      - vm-beta
    packages:
      avocado-runtime: "*"
      # Required here for the runtime build; removing it breaks `ext build`.
      # Also declared under rootfs so it reaches the device (see below).
      avocado-bls: "*"

extensions:
  avocado-ext-dev:
    source:
      type: package
      version: "*"

  avocado-ext-sshd-dev:
    source:
      type: package
      version: "*"

  # Board support. Declared literally (the runtime references it templated);
  # `avocado ext fetch` should name it explicitly -- see getting_started.md.
  avocado-bsp-{{ avocado.target.board }}:
    source:
      type: package
      version: "*"

  # The shared VM platform: qemu, the guest kernel Image, and the guest
  # initramfs, carried once. class: platform lets the VM extensions depend on it.
  vmm:
    types:
      - sysext
      - confext
    version: "0.1.6"
    class: platform
    summary: "qemu-system-aarch64 + shared guest images for the ivshmem demo"
    overlay: vmm/overlay
    enable_services:
      - avocado-vm-tune.service
    on_merge:
      - systemctl start --no-block avocado-vm-tune.service
    packages:
      htop: '*'                       # OTA demo: a live-added package
      qemu-system-aarch64: "*"
      dtc: "*"                        # launch-vm applies the shared-window DT overlay
      kernel-module-avocado-shm: "*"  # cacheable-mapping guest driver (Yocto-built)
      # The guest binary is PID 1; this is the cpio it lives in. No kernel
      # package -- guests boot the host's own /boot/Image-<kver>.
      guest-initramfs:
        compile: guest
        install: guest-install.sh

  # Board-specific CPU partitioning, templated on the target -- adding a board
  # is adding a directory under cpus/. Its own extension because the values are
  # measured per board. class: platform so the VM extensions can depend on it.
  vmm-cpus:
    types:
      - sysext
    version: "0.1.0"
    class: platform
    summary: "Measured CPU partitioning for the ivshmem demo, per board"
    overlay: cpus/{{ avocado.target }}
    depends_on:
      - name: vmm
        version: "^0.1.0"

  # One extension per VM: a role, a size, a CPU set, a unit. depends_on seals
  # vmm + vmm-cpus in ahead of them in the runtime manifest.
  vm-alpha:
    types:
      - sysext
      - confext
    version: "0.1.0"
    class: application
    summary: "Guest A -- initiates the shared-memory round trip"
    overlay: vm-alpha/overlay
    depends_on:
      - name: vmm
        version: "^0.1.0"
      - name: vmm-cpus
        version: "^0.1.0"
    enable_services:
      - avocado-vm-alpha.service
    on_merge:
      - systemctl restart --no-block avocado-vm-alpha.service
    on_unmerge:
      - systemctl stop avocado-vm-alpha.service

  vm-beta:
    types:
      - sysext
      - confext
    version: "0.1.0"
    class: application
    summary: "Guest B -- responds to the shared-memory round trip"
    overlay: vm-beta/overlay
    # Plain-string depends_on -- both spellings are valid; alpha shows the other.
    depends_on:
      - vmm
      - vmm-cpus
    enable_services:
      - avocado-vm-beta.service
    on_merge:
      - systemctl restart --no-block avocado-vm-beta.service
    on_unmerge:
      - systemctl stop avocado-vm-beta.service

# Flashing over QDL in Qualcomm EDL mode. These args apply only with
# `avocado provision --profile ufs` (see getting_started.md): the bind mount +
# --privileged are what let qdl reach usbfs.
provision:
  ufs:
    container_args:
      - --privileged
      - -v
      - /dev/bus/usb:/dev/bus/usb
  noop: {}   # stage images, touch no hardware

rootfs:
  permissions: dev
  packages:
    avocado-pkg-rootfs: "*"
    # Also a rootfs package so it reaches the device: bless / current-slot /
    # demote run from the rootfs on every A/B deploy. (It is additionally a
    # runtime package -- see above -- which the build needs.)
    avocado-bls: "*"

initramfs:
  permissions: dev

# NOT FOR PRODUCTION: empty root password for bring-up. Set a real hashed
# password before this leaves a desk.
permissions:
  dev:
    users:
      root:
        password: ""

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"
  # /dev + /sys for hardware-touching work (provision, deploy). Host networking
  # is passed on the command line for local feeds, not baked in -- see
  # getting_started.md.
  container_args:
    - --privileged
    - -v /dev:/dev
    - -v /sys:/sys
  compile:
    guest:
      compile: guest-compile.sh
      clean: guest-clean.sh
      packages:
        libc6-staticdev: '*'   # the guest is linked -static
  packages:
    avocado-sdk-toolchain: "*"
    nativesdk-cpio: "*"           # pack the guest initramfs
    nativesdk-mtools: "*"         # mcopy the rebuilt UKI into the FAT ESP
    nativesdk-systemd-boot: "*"   # ukify, to rebuild the UKI around the pinned kernel
