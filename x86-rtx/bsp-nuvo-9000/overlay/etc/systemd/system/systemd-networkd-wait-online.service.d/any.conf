# This industrial PC has 6 NICs (1x I219 + 5x I226 2.5GbE); by default
# networkd-wait-online waits for ALL managed links, so any unplugged port makes
# it time out and fail. --any: network-online.target is reached once any one
# interface is online.
[Service]
ExecStart=
ExecStart=/usr/lib/systemd/systemd-networkd-wait-online --any
