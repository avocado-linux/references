cli_requirement: ">=0.41.0"

supported_targets:
  - raspberrypi4
  - raspberrypi5

distro:
  release: 2024
  channel: edge

runtimes:
  dev:
    stone_include_paths:
      - stone/{{ avocado.target }}
    packages:
      avocado-runtime: '*'
    extensions:
      - rubicon
      - avocado-ext-cockpit
      - avocado-ext-docker
      - avocado-ext-dev
      - avocado-ext-sshd-dev
      - avocado-ext-cli
      - avocado-bsp-{{ avocado.target.board }}

extensions:
  avocado-ext-cockpit:
    source:
      type: package
      version: '*'

  avocado-ext-docker:
    source:
      type: package
      version: '*'

  avocado-ext-dev:
    source:
      type: package
      version: '*'

  avocado-ext-sshd-dev:
    source:
      type: package
      version: '*'

  avocado-bsp-{{ avocado.target.board }}:
    source:
      type: package
      version: '*'

  avocado-ext-cli:
    source:
      type: package
      # Pinned off 1.0.0: that package ships its Rust source without the schemas/
      # directory that src/utils/config_lint.rs includes at compile time, so
      # `avocado build` fails in the avocado-cli-compile section. 1.0.0~rc.5 is the
      # newest build without that include and it carries the $CC lookup fix.
      # Remove the pin once a published avocado-ext-cli lists schemas in
      # package_files and builds for raspberrypi4.
      version: '1.0.0~rc.5'

  rubicon:
    version: 0.1.0
    overlay: overlay

    modprobe:
      - brcmfmac

    enable_services:
      - rubicon-usb-gadget.service
      - rubicon-usb-network.service
      - rubicon-ca-certificates.service
      - serial-getty@ttyGS0.service
      - dnsmasq.service
      - avahi-daemon.service
      - wpa_supplicant@wlan0.service

    on_merge:
      - systemctl start --no-block rubicon-usb-gadget.service
      - systemctl start --no-block rubicon-usb-network.service
      - systemctl start --no-block rubicon-ca-certificates.service
      - systemctl start --no-block serial-getty@ttyGS0.service
      - systemctl start --no-block dnsmasq.service
      - systemctl start --no-block avahi-daemon.service
      - systemctl start --no-block wpa_supplicant@wlan0.service
      - systemctl start --no-block docker.service
      - networkctl reload

    on_unmerge:
      - systemctl stop --no-block wpa_supplicant@wlan0.service
      - systemctl stop --no-block avahi-daemon.service
      - systemctl stop --no-block dnsmasq.service
      - systemctl stop --no-block serial-getty@ttyGS0.service

    packages:
      dnsmasq: '*'
      avahi-daemon: '*'
      kernel-module-dwc2: '*'
      kernel-module-libcomposite: '*'
      kernel-module-usb-f-acm: '*'
      kernel-module-usb-f-ecm: '*'
      qemu-user-static: '*'
      qemu-user-static-binfmt: '*'

rootfs:
  permissions: dev

initramfs:
  permissions: dev

# NOT FOR PRODUCTION: the `dev` profile sets an empty root password and is
# referenced by rootfs/initramfs above. Define additional profiles with real
# users, groups, and hashed passwords, then point rootfs/initramfs at them via
# `permissions: <name>`.
permissions:
  dev:
    users:
      root:
        password: ""

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"
  container_args:
    - --privileged
    - --network=host
    - -v /dev:/dev
    - -v /sys:/sys
    - --add-host=rubicon.local:10.55.0.1

  packages:
    avocado-sdk-toolchain: '*'
