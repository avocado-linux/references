supported_targets: '*'

distro:
  release: 2026
  channel: next

##
## TensorRT for the Orin Nano: trtexec plus the TensorRT, cuDNN and cuBLAS libraries from the Avocado feed, at the versions
## JetPack 7.2.1 ships (TensorRT 10.16.2.10, cuDNN 9.20.0.46, cuBLAS 13.4.1.3 in the snapshot this reference was measured on).
##
## What this replaces on a stock Ubuntu/JetPack install. Every step is done by hand, once per board, and each one is a
## place where a board ends up different from the one before it or where a run is lost:
##
##   1. Download the installer ISO (5.0 GB) and write it to a USB stick or card.
##      Slow, and a bad write shows up only when the board will not boot it.
##   2. Boot the installer from the UEFI Boot Manager (F11 on the serial console), answer the firmware update prompt,
##      choose "Install Jetson ISO", then "Install on NVMe".
##      Needs a person at the serial console, and the menu cannot be scripted.
##   3. Wait for the installer. It took 12 minutes 37 seconds to reach Step 9 of 13, which runs
##      `apt-get install --reinstall nvidia-l4t-bootloader` inside the target and needs a working network.
##      The install behind the JetPack numbers worked, but four later runs on the same bench on 2026-11-06 failed there
##      (exit status 10, cause not isolated), and each failure came after that wait.
##   4. Finish NVIDIA's first-boot setup on the USB device-mode serial port (/dev/ttyACM0 on the host).
##      A second serial device, and a second console to keep open.
##   5. Enable SSH: `sudo ssh-keygen -A && sudo systemctl enable --now ssh`.
##      Not on by default, so a fleet needs this typed on every board.
##   6. Install the stack from the network: `sudo apt-get install nvidia-jetpack`.
##      The versions are whatever the mirrors serve that day, so two boards installed a week apart can differ.
##   7. Reboot and wait for first-boot work to settle (four minutes before the memory readings were stable).
##
## The whole sequence took about 30 minutes per board, about 15 of them manual, and the network downloads are on top.
## There is no step in it that scales past a handful of boards.
##
## With Avocado OS the same result is `avocado build -r trt` and one `avocado provision` per board, with the package
## versions fixed by the feed snapshot recorded in avocado.lock.
##
## Add the extension to a runtime and nothing else is needed on the board: trtexec is at /usr/src/tensorrt/bin/trtexec.
##

extensions:
  avocado-ext-trt:
    version: 0.1.0
    release: r0
    summary: TensorRT trtexec for the Orin Nano
    description: trtexec and the TensorRT, cuDNN and cuBLAS libraries from the target feed, at the versions JetPack 7.2.1 ships.
    license: Apache-2.0
    vendor: Avocado Linux <info@avocadolinux.org>

    types:
      - sysext

    packages:
      tensorrt-trtexec-prebuilt: '*'
      # Owns libnvinfer_plugin.so.10 and libnvonnxparser.so.10. Without it trtexec stops with
      # "Unable to open library: libnvinfer_plugin.so.10".
      tensorrt-plugins-prebuilt: '*'
      libnvinfer10: '*'
      libnvinfer-builder-resource-ptx: '*'
      cudnn: '*'
      libcublas: '*'

sdk:
  image: docker.io/avocadolinux/sdk:{{ avocado.distro.release }}-{{ avocado.distro.channel }}
