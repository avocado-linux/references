cli_requirement: ">=0.41.0"

default_target: "qemux86-64"

supported_targets:
  - qemuarm64
  - qemux86-64

##
## Distribution
##

distro:
  release: 2024
  channel: edge

##
## Runtimes
##

runtimes:
  dev:
    extensions:
      - avocado-ext-dev
      - avocado-ext-sshd-dev
      - avocado-bsp-{{ avocado.target.board }}
      - avocado-ext-connect
      - avocado-ext-tunnels
    packages:
      avocado-runtime: "*"

##
## Extensions
##

extensions:
  avocado-ext-dev:
    source:
      type: package
      version: "*"

  avocado-ext-sshd-dev:
    source:
      type: package
      version: "*"

  avocado-bsp-{{ avocado.target.board }}:
    source:
      type: package
      version: "*"

  avocado-ext-connect:
    source:
      type: package
      version: "*"

  avocado-ext-tunnels:
    source:
      type: package
      version: "*"

##
## Images
##

rootfs:
  permissions: dev

initramfs:
  permissions: dev

##
## Permissions
##

# NOT FOR PRODUCTION: the `dev` profile sets an empty root password and is
# referenced by rootfs/initramfs above. Define additional profiles with real
# users, groups, and hashed passwords, then point rootfs/initramfs at them via
# `permissions: <name>`.
permissions:
  dev:
    users:
      root:
        password: ""

##
## SDK
##

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"

  container_args:
    - --privileged
    - --network=host
    - -v /dev:/dev
    - -v /sys:/sys

  packages:
    avocado-sdk-toolchain: "*"
