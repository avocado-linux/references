cli_requirement: ">=0.41.0"

default_target: imx8mp-evk
supported_targets:
  - imx8mp-evk

distro:
  release: 2024
  channel: edge

##
## Runtimes
##

runtimes:
  dev:
    extensions:
      - avocado-ext-dev
      - avocado-ext-sshd-dev
      - avocado-bsp-{{ avocado.target.board }}
    # Cross-compile imx-boot from source via the SDK and drop it into the
    # runtime build dir, overriding any upstream-provided imx-boot. The compile
    # step runs uboot-compile.sh (TF-A + U-Boot + DDR FW bundled by
    # imx-mkimage); the install step copies flash.bin to
    # $AVOCADO_RUNTIME_BUILD_DIR/imx-boot so stone picks up ours.
    #
    # This is wired as `kernel:` rather than as a `packages:` entry because the
    # CLI only provisions the target sysroot for compile sections reached via
    # `runtimes.<n>.kernel.compile` or an extension (see
    # find_active_compile_sections). Under a `packages:` entry the section's
    # `packages:` are silently ignored, no target sysroot is created at all, and
    # the U-Boot link fails on the missing target libgcc.a. Move this back to
    # `packages:` once the CLI resolves non-kernel compile sections too.
    # The real Linux kernel is unaffected -- it still comes from
    # avocado-runtime and is staged separately.
    kernel:
      compile: uboot
      install: uboot-install.sh
    packages:
      avocado-runtime: '*'

##
## Extensions
##

extensions:
  avocado-ext-dev:
    source:
      type: package
      version: '*'

  avocado-ext-sshd-dev:
    source:
      type: package
      version: '*'

  avocado-bsp-{{ avocado.target.board }}:
    source:
      type: package
      version: '*'

##
## Images
##

rootfs:
  permissions: dev

initramfs:
  permissions: dev

##
## Permissions
##

# NOT FOR PRODUCTION: the `dev` profile sets an empty root password and is
# referenced by rootfs/initramfs above. Define additional profiles with real
# users, groups, and hashed passwords, then point rootfs/initramfs at them via
# `permissions: <name>`.
permissions:
  dev:
    users:
      root:
        password: ""

##
## SDK
##

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"

  container_args:
    - --network=host

  compile:
    uboot:
      compile: uboot-compile.sh
      clean: uboot-clean.sh
      # Installed into the TARGET sysroot (same pattern as the
      # linux-custom-kernel reference's compile section). U-Boot links
      # -lgcc, and the cross-canadian compiler resolves libgcc.a out of
      # the target sysroot rather than shipping its own.
      packages:
        libgcc-s-dev: '*'

  # Native build tools for U-Boot, TF-A, and imx-mkimage. nativesdk-*
  # packages are installed into the SDK host sysroot (not the target
  # sysroot), so they go here at the top level alongside
  # avocado-sdk-toolchain — same pattern as the linux-custom-kernel
  # reference.
  packages:
    avocado-sdk-toolchain: '*'
    nativesdk-bc: '*'
    nativesdk-bison: '*'
    nativesdk-flex: '*'
    nativesdk-openssl-bin: '*'
    # Host headers for U-Boot's tools/ build (`make all` builds all of them):
    #   openssl          -- FIT signing, via include/image.h
    #   libuuid, gnutls  -- tools/mkeficapsule.c
    #   libz             -- FIT compression
    # The -bin/-lib packages carry no headers, so the -dev ones are required.
    nativesdk-openssl-dev: '*'
    nativesdk-libuuid-dev: '*'
    nativesdk-libgnutls-dev: '*'
    nativesdk-libz-dev: '*'
    # imx-mkimage builds mkimage_imx8 with `-static -lz`, so the static
    # archives are needed on top of the shared -dev packages.
    nativesdk-libc6-staticdev: '*'
    nativesdk-libz-staticdev: '*'
    nativesdk-dtc: '*'
    # Host toolchain for HOSTCC/HOSTCXX/HOSTLD/HOSTAR -- U-Boot's fixdep,
    # mkimage, and mkenvimage run on the build host, so they must not be
    # built with the target cross-compiler. avocado-sdk-toolchain only
    # brings the cross-canadian target compiler.
    nativesdk-gcc: '*'
    nativesdk-g++: '*'
    nativesdk-binutils: '*'
    nativesdk-libc6-dev: '*'
