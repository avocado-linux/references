cli_requirement: ">=0.41.0"

default_target: jetson-orin-nx
default_target_board: icam-540

supported_targets:
  - jetson-orin-nx

distro:
  release: 2024
  channel: edge

runtimes:
  dev:
    packages:
      avocado-runtime: '*'
    extensions:
      - app
      - avocado-ext-dev
      - avocado-ext-sshd-dev
      - avocado-bsp-{{ avocado.target.board }}

extensions:
  avocado-ext-dev:
    source:
      type: package
      version: '*'

  avocado-ext-sshd-dev:
    source:
      type: package
      version: '*'

  avocado-bsp-{{ avocado.target.board }}:
    source:
      type: package
      version: '*'

  app:
    version: 0.1.0

    packages:
      gst-plugin-pylon: '*'
      gstreamer1.0: '*'
      gstreamer1.0-plugins-bad-mpegtsmux: '*'
      gstreamer1.0-plugins-base-tcp: '*'
      gstreamer1.0-plugins-base-videoconvertscale: '*'
      gstreamer1.0-plugins-good-jpeg: '*'
      gstreamer1.0-plugins-good-multipart: '*'
      gstreamer1.0-plugins-good-rtp: '*'
      gstreamer1.0-plugins-good-udp: '*'
      gstreamer1.0-plugins-nvjpeg: '*'
      gstreamer1.0-plugins-nvvidconv: '*'
      i2c-tools: '*'
      opencv: '*'
      pylon: '*'
      pylon-dev: '*'
      udev-hwdb: '*'
      usbutils: '*'
      v4l-utils: '*'

rootfs:
  permissions: dev

initramfs:
  permissions: dev

# NOT FOR PRODUCTION: the `dev` profile sets an empty root password and is
# referenced by rootfs/initramfs above. Define additional profiles with real
# users, groups, and hashed passwords, then point rootfs/initramfs at them via
# `permissions: <name>`.
permissions:
  dev:
    users:
      root:
        password: ""

sdk:
  image: "docker.io/avocadolinux/sdk:{{ config.distro.release }}"

  container_args:
    - --network=host
    - --privileged
    - -v /dev:/dev
    - -v /sys:/sys

  packages:
    avocado-sdk-toolchain: '*'
